name: build
on:
  schedule:
    - cron: "7 18 * * 0"       # 毎週月曜 03:07 JST。毎時 0 分は混んで遅れるのでずらす
    # 季節の変わり目 (1/4/7/10 月 1 日 03:07 JST) にも更新。UTC では前月末日になる
    - cron: "7 18 31 12,3 *"
    - cron: "7 18 30 6,9 *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # 下の keepalive 用
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py
        env:
          TZ: Asia/Tokyo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 公開リポジトリは 60 日コミットが無いと定期実行が止まる。有効化 API を叩いて期限を延ばす
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
