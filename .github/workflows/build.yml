name: build
on:
  schedule:
    - cron: "0 20 * * 0"      # 毎週月曜 05:00 JST
    - cron: "0 15 1 1,4,7,10 *" # 季節の変わり目 (各月 1 日 00:00 JST) にも更新
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py
        env:
          TZ: Asia/Tokyo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
